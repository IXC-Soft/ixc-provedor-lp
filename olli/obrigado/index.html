<script>
/**
 * IXC — camada de consentimento. ZERO CONFIGURAÇÃO.
 * ─────────────────────────────────────────────────────────────────────────
 * Colar/carregar SÍNCRONO no <head>, ANTES do snippet do GTM. Nada a ajustar:
 * sem cor, sem chave, sem parâmetro. Se um dia precisar decidir alguma coisa
 * para instalar, deixou de ser padrão e virou configuração.
 *
 *   carregar com uma tag script simples apontando para /js/ixc-tracking.js,
 *   e só então o snippet do GTM.
 *
 * NUNCA escreva a sequência de fechamento de script neste arquivo, nem dentro
 * de comentário: ele também é colado inline em LPs de terceiros, e o parser de
 * HTML encerra o bloco na primeira ocorrência — quebra a página inteira, sem
 * dó e sem erro que aponte para cá.
 *
 * SEM `defer` e SEM `async`, de propósito: `gtag('consent','default')` só tem
 * efeito se chegar ANTES do container carregar. Com defer o GTM sobe primeiro,
 * a tag dispara, aparece como "disparou" no Preview e não produz efeito
 * nenhum — o erro mais caro desta lista, porque não deixa rastro.
 *
 * O BANNER é neutro de propósito: barra escura, tipografia herdada da página
 * (`font: inherit`). Não pede decisão de marca para ser instalado. Quem quiser
 * marcar sobrescreve `#cookie-banner` no CSS da LP — opcional, nunca requisito.
 *
 * A CHAVE é fixa. `localStorage` já é isolado por origem: páginas do mesmo
 * domínio compartilham automaticamente (quem aceitou numa não é perguntado na
 * outra) e domínios diferentes não se enxergam, mesmo com o nome igual. Não há
 * nada a configurar.
 *
 * ÚNICO comportamento condicional, e ele é automático: o banner só aparece se
 * ainda não houver escolha registrada. Na página de obrigado o visitante já
 * respondeu na anterior, então nada aparece — sem precisar de flag.
 * ───────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var KEY = 'ixcprovedor_cookie_consent';
  var POLITICA = 'https://ixcsoft.com/politica-de-privacidade/';

  function guardado() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  /* ── 1. Consent Mode v2 do Google — padrão NEGADO ───────────────────────
     Não pode ser tag de container: precisa existir antes do GTM carregar.
     E "não declarado" não é "negado" — sem isto o GTM não retém tag nenhuma. */
  window.dataLayer = window.dataLayer || [];
  if (typeof window.gtag !== 'function') {
    window.gtag = function () { window.dataLayer.push(arguments); };
  }
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'granted',
    security_storage: 'granted',
    wait_for_update: 500
  });

  /* ── 2. Consentimento do HubSpot ────────────────────────────────────────
     API própria do HubSpot, sem relação nenhuma com o Consent Mode do Google.
     São dois sistemas separados: precisa dos dois. */
  window._hsp = window._hsp || [];

  function aplicar(status) {
    var ok = status === 'granted';
    gtag('consent', 'update', {
      ad_storage: ok ? 'granted' : 'denied',
      ad_user_data: ok ? 'granted' : 'denied',
      ad_personalization: ok ? 'granted' : 'denied',
      analytics_storage: ok ? 'granted' : 'denied'
    });
    window._hsp.push(['setHubSpotConsent',
      { analytics: ok, advertisement: ok, functionality: ok }]);
    window.dataLayer.push({ event: 'cookie_consent', cookie_consent_status: status });
  }

  /* Reaplica a escolha já registrada. Sem isto, quem já decidiu volta como
     indeciso e as tags ficam retidas em toda visita seguinte. */
  var escolha = guardado();
  if (escolha) {
    aplicar(escolha);
  } else {
    window._hsp.push(['setHubSpotConsent',
      { analytics: false, advertisement: false, functionality: false }]);
  }

  /* Exposto para o banner e para um link "gerenciar cookies" no rodapé. */
  window.setCookieConsent = function (status) {
    try { localStorage.setItem(KEY, status); } catch (e) {}
    aplicar(status);
    var el = document.getElementById('cookie-banner');
    if (el) el.classList.remove('is-visible');
  };

  /* ── 3. Banner ────────────────────────────────────────────────────────── */
  if (escolha) return;

  function montar() {
    if (document.getElementById('cookie-banner')) return;

    var css = document.createElement('style');
    css.textContent =
      '#cookie-banner{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;' +
      'background:#0f1115;border-top:1px solid rgba(255,255,255,.14);' +
      'box-shadow:0 -8px 30px -18px rgba(0,0,0,.8);transform:translateY(110%);' +
      'transition:transform .4s ease;font:inherit}' +
      '#cookie-banner.is-visible{transform:translateY(0)}' +
      '#cookie-banner .ci{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;' +
      'flex-direction:column;gap:16px;align-items:flex-start}' +
      '#cookie-banner p{margin:0;color:#e6e6e6;font-size:14px;line-height:1.55;font-family:inherit}' +
      '#cookie-banner a{color:#fff;text-decoration:underline}' +
      '#cookie-banner .ca{display:flex;gap:12px;flex-wrap:wrap;width:100%}' +
      '#cookie-banner button{font:inherit;font-size:14px;font-weight:700;border-radius:999px;' +
      'padding:11px 26px;cursor:pointer;border:1px solid transparent;transition:opacity .2s ease}' +
      '#cookie-banner .ok{background:#fff;color:#0f1115}' +
      '#cookie-banner .ok:hover{opacity:.88}' +
      '#cookie-banner .no{background:transparent;color:#e6e6e6;border-color:rgba(255,255,255,.28)}' +
      '#cookie-banner .no:hover{background:rgba(255,255,255,.08)}' +
      '#cookie-banner button:focus-visible{outline:2px solid #fff;outline-offset:2px}' +
      '@media(min-width:768px){#cookie-banner .ci{flex-direction:row;align-items:center;' +
      'justify-content:space-between;gap:32px}#cookie-banner .ca{width:auto;flex-shrink:0}}';
    document.head.appendChild(css);

    var el = document.createElement('div');
    el.id = 'cookie-banner';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-live', 'polite');
    el.setAttribute('aria-label', 'Aviso de cookies');
    el.innerHTML =
      '<div class="ci"><p>Utilizamos cookies para melhorar sua experiência, analisar o tráfego e ' +
      'personalizar conteúdo. Ao continuar navegando, você concorda com nossa ' +
      '<a href="' + POLITICA + '" target="_blank" rel="noopener">Política de Privacidade</a>.</p>' +
      '<div class="ca"><button type="button" class="no">Rejeitar</button>' +
      '<button type="button" class="ok">Aceitar cookies</button></div></div>';
    document.body.appendChild(el);

    el.querySelector('.ok').addEventListener('click', function () { setCookieConsent('granted'); });
    el.querySelector('.no').addEventListener('click', function () { setCookieConsent('denied'); });
    setTimeout(function () { el.classList.add('is-visible'); }, 600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', montar);
  } else {
    montar();
  }
})();

/* ═════════════════════════════════════════════════════════════ */

/**
 * Captura de UTMs / click IDs → campos ocultos do formulário HubSpot (embed React).
 * O form é injetado em #hsFormContainer quando o modal "Agende sua demonstração" abre;
 * o MutationObserver persiste e preenche assim que o form aparece (mesmo tarde).
 *
 * PRÉ-REQUISITO no HubSpot: o formulário (2415bdc0-...) precisa ter os campos ocultos
 * com nome igual às chaves abaixo (aceita também o prefixo "var_", normalizado).
 */
(function () {
  var KEYS = [
    'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content',
    'gclid', 'fbclid', 'ad_id',
    'gads_keyword', 'gads_ad_id', 'gads_campaign'
  ];
  var COOKIE = 'ixcprovedor_attribution';
  var COOKIE_DAYS = 30;
  var SCOPE_SELECTOR = '#hsFormContainer';

  /* Resolvido só quando o DOM existe. Antes era resolvido na carga, o que
     quebrava se o arquivo fosse colado inline no <head>: `#hsFormContainer`
     ainda não existe, o escopo caía para `document`, e `observe(document.body)`
     estourava porque o body também não existe ainda. */
  var scope = null;

  function aoCarregar(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else { fn(); }
  }

  function readCookie() {
    var m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE + '=([^;]*)'));
    if (!m) return {};
    try { return JSON.parse(decodeURIComponent(m[1])); } catch (e) { return {}; }
  }
  function writeCookie(obj) {
    var d = new Date(); d.setTime(d.getTime() + COOKIE_DAYS * 864e5);
    document.cookie = COOKIE + '=' + encodeURIComponent(JSON.stringify(obj)) +
      ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }

  var params = new URLSearchParams(window.location.search);
  var stored = readCookie();
  var data = {};
  KEYS.forEach(function (k) {
    var v = params.get(k);
    if (v) { data[k] = v; } else if (stored[k]) { data[k] = stored[k]; }
  });
  if (Object.keys(data).length) writeCookie(data);

  function fieldKey(name) {
    if (!name) return name;
    var k = name.indexOf('/') !== -1 ? name.split('/').pop() : name;
    return k.replace(/^var_/, '');
  }

  function setNativeValue(el, value) {
    var proto = el.tagName === 'TEXTAREA'
      ? window.HTMLTextAreaElement.prototype
      : window.HTMLInputElement.prototype;
    var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
    setter.call(el, value);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function fill(form) {
    if (!Object.keys(data).length) return;
    form.querySelectorAll('input,select,textarea').forEach(function (el) {
      var k = fieldKey(el.name);
      if (k && data[k] && el.value !== data[k]) setNativeValue(el, data[k]);
    });
  }

  function fillAll() {
    if (!scope) return;
    scope.querySelectorAll('form').forEach(function (f) {
      fill(f);
      if (!f._attrBound) {
        f._attrBound = true;
        f.addEventListener('submit', function () { fill(f); }, true);
      }
    });
  }

  aoCarregar(function () {
    scope = (SCOPE_SELECTOR && document.querySelector(SCOPE_SELECTOR)) || document.body;
    if (!scope) return;
    /* O formulário é injetado tarde, e de novo se o modal reabrir. */
    new MutationObserver(fillAll).observe(scope, { childList: true, subtree: true });
    [300, 800, 1500, 3000, 5000].forEach(function (t) { setTimeout(fillAll, t); });
  });
})();

    /* ==========================================================================
       VÍDEO INSTITUCIONAL (INTEGRADO À 2ª DOBRA)
       ========================================================================== */

    .video-card-wrapper {
      position: relative;
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
    }

    .video-card-glow {
      display: none;
    }

    .video-card {
      position: relative;
      width: 100%;
    }

    .video-player-container {
      display: none;
      position: relative;
      width: 100%;
      background: #1C1C1E;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .video-player-container::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background-color: #0A0A0C;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: none;
    }

    .video-tablet-screen {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 Aspect Ratio */
      background: #181818;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 1023px) {
      .video-player-container {
        border-radius: 26px;
        padding: 8px;
      }

      .video-player-container::before {
        top: 2px;
        width: 5px;
        height: 5px;
      }

      .video-tablet-screen {
        border-radius: 18px;
      }
    }

    @media (max-width: 767px) {
      .video-player-container {
        border-radius: 20px;
        padding: 6px;
      }

      .video-player-container::before {
        top: 1px;
        width: 4px;
        height: 4px;
      }

      .video-tablet-screen {
        border-radius: 14px;
      }
    }

    .video-poster-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.7) contrast(1.05);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
    }

    .video-card:hover .video-poster-image {
      transform: scale(1.03);
      filter: brightness(0.8) contrast(1.1);
    }

    .video-player-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          rgba(33, 33, 33, 0.45) 0%,
          rgba(33, 33, 33, 0.2) 50%,
          rgba(33, 33, 33, 0.8) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 2;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .video-player-overlay {
        padding: 32px;
      }
    }

    .video-player-top-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(33, 33, 33, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      align-self: flex-start;
      pointer-events: auto;
    }

    .video-player-top-tag-logo {
      height: 16px;
      width: auto;
    }

    .video-player-top-tag-text {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--neutral);
    }

    .video-play-button-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      outline: none;
    }

    .video-play-button {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(144, 59, 255, 0.45);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    }

    @media (min-width: 768px) {
      .video-play-button {
        width: 96px;
        height: 96px;
      }
    }

    .video-play-button::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: rgba(144, 59, 255, 0.25);
      animation: pulse-dot 2.5s infinite ease-in-out;
      z-index: -1;
    }

    .video-play-button-wrapper:hover .video-play-button {
      transform: scale(1.12);
      box-shadow: 0 18px 45px rgba(144, 59, 255, 0.65);
    }

    .video-play-icon {
      width: 28px;
      height: 28px;
      color: #FFFFFF;
      margin-left: 4px;
      transition: transform 0.3s ease;
    }

    @media (min-width: 768px) {
      .video-play-icon {
        width: 36px;
        height: 36px;
      }
    }

    .video-play-button-wrapper:hover .video-play-icon {
      transform: scale(1.08);
    }

    .video-controls-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      pointer-events: auto;
    }

    .video-progress-bar {
      flex-grow: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .video-progress-fill {
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 2px;
    }

    .video-time-label {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      color: rgba(252, 251, 255, 0.8);
      white-space: nowrap;
    }

    .video-control-icon {
      width: 20px;
      height: 20px;
      color: rgba(252, 251, 255, 0.8);
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .video-control-icon:hover {
      color: #FFFFFF;
      transform: scale(1.1);
    }

    /* Video Modal */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .video-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .video-modal-content {
      position: relative;
      width: 100%;
      max-width: 960px;
      background: #000000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-modal-close {
      position: absolute;
      top: -48px;
      right: 0;
      background: transparent;
      border: none;
      color: #FFFFFF;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
    }

    .video-modal-close:hover {
      color: var(--primary-light);
    }

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileMenuCloseBtn = document.getElementById('mobile-menu-close');
      const iconBars = document.getElementById('menu-icon-bars');
      const iconClose = document.getElementById('menu-icon-close');
      const header = document.getElementById('header');

      const openMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
        if (mobileMenu) mobileMenu.classList.remove('hidden');
        if (iconBars) iconBars.classList.add('hidden');
        if (iconClose) iconClose.classList.remove('hidden');
        document.body.classList.add('menu-open');
        document.documentElement.classList.add('menu-open');
      };

      const closeMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
        if (mobileMenu) mobileMenu.classList.add('hidden');
        if (iconBars) iconBars.classList.remove('hidden');
        if (iconClose) iconClose.classList.add('hidden');
        document.body.classList.remove('menu-open');
        document.documentElement.classList.remove('menu-open');
      };

      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
          const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
          if (isExpanded) {
            closeMobileMenu();
          } else {
            openMobileMenu();
          }
        });

        if (mobileMenuCloseBtn) {
          mobileMenuCloseBtn.addEventListener('click', closeMobileMenu);
        }
      }

      // Dynamic header styling on scroll
      window.addEventListener('scroll', () => {
        if (header) {
          if (window.scrollY > 20) {
            header.classList.add('scrolled');
          } else {
            header.classList.remove('scrolled');
          }
        }
      });
    });
  </script>
