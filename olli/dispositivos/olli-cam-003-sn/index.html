  <!-- Script for Interactive Header & Mobile Navigation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileMenuCloseBtn = document.getElementById('mobile-menu-close');
      const mobileMenuLogo = document.querySelector('.mobile-menu-logo');
      const iconBars = document.getElementById('menu-icon-bars');
      const iconClose = document.getElementById('menu-icon-close');
      const mobileLinks = document.querySelectorAll('.header-mobile-link, .mobile-menu-cta');
      const header = document.getElementById('header');
      const overlay = document.getElementById('mobile-menu-overlay');

      // Toggle Mobile Navigation
      const openMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
        if (mobileMenu) mobileMenu.classList.remove('hidden');
        if (iconBars) iconBars.classList.add('hidden');
        if (iconClose) iconClose.classList.remove('hidden');
        if (overlay) overlay.classList.add('active');
        document.body.classList.add('menu-open');
        document.documentElement.classList.add('menu-open');
      };

      const closeMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
        if (mobileMenu) mobileMenu.classList.add('hidden');
        if (iconBars) iconBars.classList.remove('hidden');
        if (iconClose) iconClose.classList.add('hidden');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('menu-open');
        document.documentElement.classList.remove('menu-open');
      };

      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
          const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
          if (isExpanded) {
            closeMobileMenu();
          } else {
            openMobileMenu();
          }
        });

        if (mobileMenuCloseBtn) {
          mobileMenuCloseBtn.addEventListener('click', () => {
            closeMobileMenu();
          });
        }

        if (mobileMenuLogo) {
          mobileMenuLogo.addEventListener('click', () => {
            closeMobileMenu();
          });
        }

        // Close menu on clicking any link
        mobileLinks.forEach(link => {
          link.addEventListener('click', () => {
            closeMobileMenu();
          });
        });

        // Close menu on clicking overlay
        if (overlay) {
          overlay.addEventListener('click', () => {
            closeMobileMenu();
          });
        }

        // Close menu if window resizes to desktop view
        window.addEventListener('resize', () => {
          if (window.innerWidth >= 768 && menuBtn.getAttribute('aria-expanded') === 'true') {
            closeMobileMenu();
          }
        });
      }

      // Add dynamic background shadow/effect on scroll
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      });
    });
  </script>
